<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1600px; height: 900px; background: #06070a; overflow: hidden; }
  .wrap { position: relative; width: 100%; height: 100%; font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 620px at 78% 22%, rgba(70, 96, 140, .34), transparent 62%),
      radial-gradient(760px 540px at 8% 92%, rgba(255, 75, 47, .16), transparent 62%),
      linear-gradient(160deg, #0a0c11 0%, #06070a 62%, #050608 100%);
  }
  .grid {
    position: absolute; inset: 0; opacity: .5;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: radial-gradient(circle at 46% 46%, #000 26%, transparent 82%);
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 48% 46%, transparent 42%, rgba(0,0,0,.72) 100%);
  }
  .frame { position: absolute; inset: 26px; border: 1px solid rgba(255,255,255,.06); }
  .left { position: absolute; left: 92px; top: 84px; width: 800px; z-index: 3; }
  .eyebrow {
    display: flex; align-items: center; gap: 14px;
    font-family: "Consolas", monospace; font-size: 15px; letter-spacing: .26em;
    color: #6f757e;
  }
  .eyebrow b { color: #ff4b2f; font-weight: 600; }
  .eyebrow .sep { width: 54px; height: 1px; background: rgba(255,255,255,.16); }
  .clock {
    margin-top: 30px;
    font-family: "Consolas", monospace; font-size: 104px; line-height: .9;
    color: #ff4b2f; letter-spacing: -.02em;
    text-shadow: 0 0 60px rgba(255,75,47,.28);
  }
  .clock small { display: block; margin-top: 12px; font-size: 17px; letter-spacing: .24em; color: #a35b4e; }
  h1 {
    margin-top: 26px;
    font-family: "Songti SC", "SimSun", serif;
    font-size: 92px; line-height: 1.06; letter-spacing: .05em; color: #f3f0e9;
  }
  h1 em { font-style: normal; color: #ff4b2f; }
  h1 .thin { font-size: 74px; color: #d9d5cc; }
  .tagline { margin-top: 22px; font-size: 19px; line-height: 1.8; color: #9ba0a8; letter-spacing: .04em; }
  .tagline b { color: #e9e5dd; font-weight: 500; }
  .stats { margin-top: 34px; display: flex; gap: 34px; align-items: flex-end; }
  .stat .n { font-family: "Consolas", monospace; font-size: 34px; color: #f2efe8; }
  .stat .k { margin-top: 5px; font-family: "Consolas", monospace; font-size: 11px; letter-spacing: .2em; color: #6f757e; }
  .stat.red .n { color: #ff4b2f; }
  .foot {
    position: absolute; left: 92px; bottom: 62px;
    font-family: "Consolas", monospace; font-size: 12px; letter-spacing: .22em; color: #4b5057;
    display: flex; gap: 28px;
  }
  .hero {
    position: absolute; right: 78px; top: 50%; transform: translateY(-50%);
    height: 780px; width: 600px; z-index: 2;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .hero .ring {
    position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
    width: 520px; height: 520px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: inset 0 0 120px rgba(255,75,47,.07);
  }
  .hero .ring::after {
    content: ""; position: absolute; inset: 34px; border-radius: 50%;
    border: 1px dashed rgba(255,75,47,.16);
  }
  .hero img { height: 100%; width: auto; filter: drop-shadow(0 40px 80px rgba(0,0,0,.8)); }
  .stamp {
    position: absolute; right: 116px; bottom: 78px; z-index: 4;
    border: 2px solid #ff4b2f; color: #ff4b2f;
    padding: 12px 18px; transform: rotate(-4deg);
    font-family: "Songti SC", serif; font-size: 22px; letter-spacing: .22em;
    background: rgba(255,75,47,.05);
  }
  .vertical {
    position: absolute; right: 40px; top: 50%; transform: translateY(-50%);
    writing-mode: vertical-rl; font-family: "Consolas", monospace;
    font-size: 10px; letter-spacing: .5em; color: rgba(255,255,255,.14);
  }
  .thumbs {
    position: absolute; right: 96px; top: 64px; z-index: 4;
    display: flex; gap: 6px;
  }
  .thumbs img {
    width: 30px; height: 40px; object-fit: cover; object-position: 50% 8%;
    opacity: .34; filter: grayscale(.6); border: 1px solid rgba(255,255,255,.08);
  }
  .thumbs img:nth-child(1) { opacity: .95; filter: none; border-color: #ff4b2f; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="vignette"></div>
  <div class="frame"></div>
  <div class="vertical">1024 BUILDER / CASE P0-1024 / WAR ROOM 03:08</div>



  <div class="left">
    <div class="eyebrow"><b>1024 BUILDER 作品秀</b><span class="sep"></span>CASE P0-1024 · 生产库失踪案</div>
    <div class="clock">03:07:12<small>PROD_MAIN / NOT FOUND</small></div>
    <h1>P0 事故剧本杀<br><span class="thin">谁动了</span><em>生产库</em></h1>
    <div class="tagline">
      270 万订单消失，唯一快照在 7 天前被关掉。<br>
      作战室里有 <b>8 个 AI Agent</b>，全都有嫌疑。你只有 <b>1024 秒</b>。
    </div>
    <div class="stats">
      <div class="stat"><div class="n">08</div><div class="k">AGENTS</div></div>
      <div class="stat"><div class="n">16</div><div class="k">CLUES</div></div>
      <div class="stat red"><div class="n">1024</div><div class="k">SECONDS</div></div>
      <div class="stat"><div class="n">12</div><div class="k">ENDINGS</div></div>
    </div>
  </div>

  <div class="hero">
    <div class="ring"></div>
    <img src="../assets/portraits/deepseek.webp">
  </div>

  <div class="stamp">谁按下了回车</div>
  <div class="foot"><span>SINGLE FILE / HTML</span><span>OFFLINE PLAYABLE</span><span>WEB AUDIO · NO ASSETS</span></div>
</div>
</body>
</html>
